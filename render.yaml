services:
  - type: web
    name: rotina
    runtime: docker
    plan: free
    rootDir: sistema
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /docs
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: rotina-em-ordem
          property: connectionString
